<script>
(function () {
  "use strict";

  var frame      = document.getElementById("frame");
  var viewHome   = document.getElementById("view-home");
  var viewPage   = document.getElementById("view-page");
  var backBar    = document.getElementById("backBar");
  var backHome   = document.getElementById("backHome");

  var PAGES = {
    guichu: { src: "src-guichu", route: "guichu-culture.html" },
    homo:   { src: "src-homo",   route: "homo-culture.html" }
  };

  var cache = {};
  var innerDoc = null;
  var current = "home";

  /* ---------- base64 -> UTF-8 文本 ---------- */
  function decodeUtf8(b64) {
    var bin = window.atob(b64.replace(/\s+/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    if (window.TextDecoder) {
      return new TextDecoder("utf-8").decode(bytes);
    }
    var out = "";
    for (var j = 0; j < bytes.length; j += 8192) {
      out += String.fromCharCode.apply(null, bytes.subarray(j, j + 8192));
    }
    return decodeURIComponent(escape(out));
  }

  function sourceOf(key) {
    if (!cache[key]) {
      var holder = document.getElementById(PAGES[key].src);
      cache[key] = decodeUtf8(holder.textContent || holder.innerHTML);
    }
    return cache[key];
  }

  /* ---------- 把子页面写进 iframe ---------- */
  function mount(key) {
    var html = sourceOf(key);
    var doc = null;
    try {
      doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
    } catch (e) {
      doc = null;
    }
    if (doc && doc.open) {
      doc.open();
      doc.write(html);
      doc.close();
      innerDoc = doc;
      return true;
    }
    frame.setAttribute("srcdoc", html);
    innerDoc = null;
    return false;
  }

  /* ---------- 高度自适应 ---------- */
  function fitHeight() {
    if (!innerDoc) {
      frame.style.height = "900px";
      return;
    }
    var h = 0;
    try {
      h = Math.max(
        innerDoc.documentElement ? innerDoc.documentElement.scrollHeight : 0,
        innerDoc.body ? innerDoc.body.scrollHeight : 0
      );
    } catch (e) { h = 0; }
    frame.style.height = Math.max(1200, h) + "px";
  }

  /* ---------- 改造子页面里的链接 ---------- */
  function rewire() {
    if (!innerDoc) { return; }
    var links = innerDoc.querySelectorAll("a[href]");
    Array.prototype.forEach.call(links, function (a) {
      var href = a.getAttribute("href") || "";
      var target = null;
      if (href.indexOf("guichu-culture") !== -1) { target = "guichu"; }
      else if (href.indexOf("homo-culture") !== -1) { target = "homo"; }
      else if (href.indexOf("index.html") !== -1) { target = "home"; }
      else if (href.charAt(0) === "#") { target = "#" + href.slice(1); }
      else { return; }

      a.setAttribute("href", "javascript:void(0)");
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        if (target === "#") { return; }
        if (target.charAt(0) === "#") {
          scrollToInner(target.slice(1));
        } else {
          go(target);
        }
      });
    });
  }

  function scrollToInner(id) {
    if (!innerDoc) { return; }
    var el = innerDoc.getElementById(id);
    if (!el) { return; }
    var rel = frame.getBoundingClientRect().top + el.getBoundingClientRect().top;
    window.scrollTo({ top: window.scrollY + rel - 8, behavior: "smooth" });
  }

  /* ---------- 子页面目录高亮跟随父页面滚动 ---------- */
  function syncInnerNav() {
    if (!innerDoc) { return; }
    var links = innerDoc.querySelectorAll("#navLinks a");
    if (!links.length) { return; }
    var frameTop = frame.getBoundingClientRect().top;
    var currentHref = null;
    Array.prototype.forEach.call(links, function (a) {
      var el = innerDoc.querySelector(a.getAttribute("href"));
      if (!el) { return; }
      if (frameTop + el.getBoundingClientRect().top <= 150) {
        currentHref = a.getAttribute("href");
      }
    });
    Array.prototype.forEach.call(links, function (a) {
      a.classList.toggle("active", a.getAttribute("href") === currentHref);
    });
  }

  /* ---------- 视图切换 ---------- */
  function go(key) {
    if (key === current && key !== "home") {
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    current = key;
    if (key === "home") {
      viewPage.hidden = true;
      viewHome.hidden = false;
      backBar.hidden = true;
      innerDoc = null;
      if (location.hash) {
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { }
      }
    } else {
      viewHome.hidden = true;
      viewPage.hidden = false;
      backBar.hidden = false;
      mount(key);
      rewire();
      fitHeight();
      if (location.hash !== "#" + key) {
        try { history.replaceState(null, "", "#" + key); } catch (e) { }
      }
    }
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (btn) {
    btn.addEventListener("click", function () { go(btn.getAttribute("data-go")); });
  });
  backHome.addEventListener("click", function () { go("home"); });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "");
    go(h === "guichu" || h === "homo" ? h : "home");
  });

  /* ---------- 滚动 / 尺寸跟随 ---------- */
  var ticking = false;
  function onScrollOrResize() {
    if (ticking) { return; }
    ticking = true;
    window.requestAnimationFrame(function () {
      syncInnerNav();
      ticking = false;
    });
  }
  window.addEventListener("scroll", onScrollOrResize, { passive: true });
  window.addEventListener("resize", function () {
    if (current !== "home") { fitHeight(); }
  });

  /* ---------- 首屏 ---------- */
  var initial = location.hash.replace("#", "");
  if (initial === "guichu" || initial === "homo") {
    go(initial);
  }

  /* 子页面里的固定按钮在整页内嵌模式下没有意义，注入一段样式隐藏掉 */
  var styleFix = document.createElement("style");
  styleFix.textContent = "#toTop{display:none !important}#frame{overflow:hidden}";

  var frameLoadGuard = window.setInterval(function () {
    if (innerDoc && innerDoc.head && !innerDoc.head.querySelector("[data-shell-fix]")) {
      styleFix.setAttribute("data-shell-fix", "1");
      innerDoc.head.appendChild(styleFix);
      window.clearInterval(frameLoadGuard);
    }
  }, 60);
  window.setTimeout(function () { window.clearInterval(frameLoadGuard); }, 4000);
})();
</script>
